# BAGMAN CD-3 WI-3 runtime — bagman-db / bagman-objects / bagman-api
# (PID §5-8, §15, §24-33).
#
# Project name is explicitly "bagman" (also passable via
# `docker compose -p bagman ...`) so every container/volume/network
# this stack creates is genuinely `bagman-*`, not an ambiguous
# auto-generated prefix derived from whatever directory this file
# happens to be run from.
#
# Network exposure (PID §32): bagman-db and bagman-objects publish NO
# host port by default — internal service-to-service traffic on
# bagman-net only. bagman-api is the one deliberate, documented
# exception: it is BAGMAN's intended access point, bound to
# 127.0.0.1 only (not 0.0.0.0) so it is reachable from this host but
# not the wider network by default.
#
# A host-published port for bagman-db/bagman-objects, for local
# debugging only, is available as an explicit opt-in override file —
# see docker-compose.debug-ports.yml — never applied by default.
#
# Usage:
#   docker compose -p bagman -f deployment/compose/docker-compose.yml build \
#     --build-arg GIT_COMMIT=$(git rev-parse HEAD)
#   docker compose -p bagman -f deployment/compose/docker-compose.yml up -d
# (or `make build` / `make start` — see the repo-root Makefile, which
# exports BAGMAN_GIT_COMMIT from `git rev-parse HEAD` automatically.)

name: bagman

networks:
  bagman-net:
    name: bagman-net

volumes:
  bagman-postgres-data:
    name: bagman-postgres-data
  # Old MinIO volume — kept defined (but no longer referenced by any
  # service below) so it remains available for rollback until actual
  # production cutover happens (a separate, later step this WO does
  # not perform). Do NOT remove this entry and do NOT let anything
  # write into it going forward.
  bagman-object-data:
    name: bagman-object-data
  # New SeaweedFS-backed object storage volume — deliberately a
  # DIFFERENT named volume from `bagman-object-data` above (never
  # reused), so the old MinIO volume's bytes are never touched by this
  # cutover.
  bagman-seaweedfs-data:
    name: bagman-seaweedfs-data

secrets:
  # Real secrets, provisioned externally by the PL at
  # /srv/bagman-secrets/ (outside this repository, chmod 600) — never
  # copied into this file, never committed. See PID §29-31.
  postgres_password:
    file: /srv/bagman-secrets/postgres_password
  # CD-6 MinIO withdrawal WO: these two secrets are no longer
  # referenced by `bagman-objects` below (it now uses
  # `seaweedfs_s3_config` instead — see that service's own comment).
  # Kept defined here, not deleted: actual production cutover away
  # from the old MinIO instance is a SEPARATE, later step this WO does
  # not perform, and `bagman-api` below still references these two
  # secrets for its own MinIO-pointed configuration until that cutover
  # happens.
  minio_root_user:
    file: /srv/bagman-secrets/minio_root_user
  minio_root_user_password:
    file: /srv/bagman-secrets/minio_root_user_password
  # CD-6 MinIO withdrawal WO: the SeaweedFS 4.47 S3-gateway static
  # identity config file (see `bagman-objects` below) — the
  # `{"identities": [...]}` JSON shape SeaweedFS's `-s3.config` flag
  # expects, holding the access/secret key pair BAGMAN's own object
  # store client authenticates with. Same `/srv/bagman-secrets/<name>`
  # convention as every other entry in this block (the architect's WO
  # text illustrated `/opt/bagman/secrets/objects/...` only as a
  # conceptual example — this repo's own real, established secret root
  # is `/srv/bagman-secrets/`).
  seaweedfs_s3_config:
    file: /srv/bagman-secrets/seaweedfs_s3_config.json
  # CD-5 WI-2 (PID §13): the BAGMAN-scoped virtual key for the EXISTING
  # Trinity LiteLLM installation — never a second inference-control-plane
  # deployment (PID §8). Provisioned externally by Matt directly, same
  # discipline as the three secrets above. NOTE the real provisioned
  # filename is `litellm_gateway_key`, not the `trinity_litellm_api_key`
  # name PID §13's own text originally guessed (confirmed present at this
  # path immediately before this WI began).
  litellm_gateway_key:
    file: /srv/bagman-secrets/litellm_gateway_key
  # CD-5 WI-3 (PID §13/§17-18) originally reserved an `anthropic_api_key`
  # Compose secret here for a direct Anthropic-API operator provider.
  # REMOVED 2026-09-16 (Gate-2 closure, final cleanup delta before
  # merge): the architect ruled BAGMAN does not use a direct Anthropic
  # API key at all — the sole authoritative operator path is the
  # bounded headless Claude Code runner (`agent/claude_code/`), which
  # authenticates via its own OAuth/session credential (see the
  # `volumes:` mount on `bagman-api` below,
  # `/srv/bagman-secrets/claude_code_home`), never an API key. No
  # `anthropic_api_key` secret is declared here, commented or
  # otherwise — see `PID.md` §97 and the CD-5 evidence file for the
  # full, preserved history of this correction.

services:
  bagman-db:
    image: postgres:17
    container_name: bagman-db
    networks:
      - bagman-net
    # No host port publish (PID §32) — bagman-api reaches this over
    # bagman-net only, at bagman-db:5432.
    environment:
      POSTGRES_DB: bagman
      POSTGRES_USER: bagman
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      PGTZ: UTC
      TZ: UTC
    secrets:
      - postgres_password
    volumes:
      - bagman-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bagman -d bagman"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  bagman-objects:
    # CD-6 migration-safety hardening delta (2026-09-25): the actual
    # production cutover to this service (still pointing `bagman-api`
    # at the OLD MinIO secrets below as of this delta — see that
    # service's own `BAGMAN_OBJECT_STORE_*` block) is a separate,
    # later, Architect-authorized step. The full cutover sequence
    # (quiesce writers, stop `bagman-api`, run
    # `scripts/migrate_object_store.py`, freeze/refreeze-verify the
    # three DB storage_reference sources, reuse — never rotate —
    # existing credentials, restart) is documented in that script's
    # own module docstring, "Production cutover sequence" — read it
    # before performing the cutover.
    #
    # CD-6 MinIO withdrawal WO (2026-09-24): the original MinIO pin,
    # `quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z.hotfix.7aa24e772`,
    # was WITHDRAWN from quay.io (no longer pullable at all) and the
    # entire MinIO "community edition" release line it came from is
    # now unmaintained/archived upstream with several unpatched CVEs —
    # there is no newer community-edition tag to move to instead.
    #
    # Replacement: SeaweedFS 4.47 (`ghcr.io/chrislusf/seaweedfs`).
    # Chosen after: (1) supply-chain verification — cosign signature
    # verified (issuer `https://token.actions.githubusercontent.com`,
    # identity
    # `https://github.com/seaweedfs/seaweedfs/.github/workflows/container_release_unified.yml@refs/tags/4.47`),
    # upstream commit `c5073360007d28385a33426a42ac3e4ec504c5a3` matches
    # the `4.47` tag exactly; (2) a Trivy scan reconciling 8 relevant
    # CVEs (7 named by the architect + 1 more found), all confirmed
    # fixed in 4.47 via GitHub compare-API ancestry checks against that
    # exact commit — one residual HIGH (CVE-2026-84445, a gRPC
    # xDS-server DoS in the pinned grpc-go dev dependency) assessed as
    # not applicable, since SeaweedFS never runs a gRPC xDS server
    # role reachable via anything it itself exposes; (3) a live proof
    # of the exact runtime shape below against BAGMAN's real,
    # unmodified `persistence/objects/minio_store.py::MinIOObjectStore`
    # — full S3-compatibility bounded test, a restart-durability +
    # soak test, and a disposable production-shape migration proof —
    # all passed with ZERO code changes to that module.
    #
    # The digest below is the authoritative reference; the `:4.47` tag
    # is for operator readability only — always resolve/verify against
    # the digest, never trust the tag alone to mean the same bytes
    # tomorrow that it means today:
    #   manifest-list (multi-arch index): sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    #   amd64:                            sha256:f83509b0721dfd8e2e07faf76c0a899f67a8a889c89abe2fa0a5227ba1320362
    #   arm64:                            sha256:d4cf67729aa8777e1a43a5b61d72e5b96179e4b7bac9a221cb14cbc2036cb32e
    image: ghcr.io/chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    container_name: bagman-objects
    networks:
      - bagman-net
    # No host port publish by default (PID §32) — unchanged from the
    # MinIO-era default. A host-published port, for local debugging
    # only, is an explicit opt-in override — see
    # docker-compose.debug-ports.yml — never the default.
    #
    # `weed server` (NOT `weed mini` — `mini` only exposes one global
    # `-ip.bind` with no per-component override, so it cannot isolate
    # the S3 gateway's own bind address from master/volume/filer/admin
    # the way this command does). Live-verified against this exact
    # digest on this host: `-ip=127.0.0.1 -ip.bind=127.0.0.1` binds
    # master(9333)/volume(8080 in `server` mode — NOT 9340, which is
    # `mini`'s port)/filer(8888)/admin to loopback ONLY inside the
    # container (confirmed via a second container on the same Docker
    # network: 9333/8888/8080 all unreachable); `-s3.ip.bind=0.0.0.0`
    # is the one deliberate per-component override that lets the S3
    # gateway alone be reachable from other containers on `bagman-net`
    # — it is still never published to the host, since that is
    # controlled entirely by this service having no `ports:` block, not
    # by this flag. `-s3.port.iceberg=0 -s3.port.lance=0` are REQUIRED:
    # without them SeaweedFS auto-starts an Iceberg REST Catalog
    # (8181) and a Lance Namespace server (9101), BOTH of which bind to
    # `0.0.0.0` regardless of `-s3.ip.bind` — confirmed live, reachable
    # from a second container until these two flags were added; this is
    # the one place this image's default behavior is NOT secure and
    # must be explicitly overridden. `-volume.max=0` (auto-size on free
    # disk) is REQUIRED — the `server`-mode default (`volume.max=8`)
    # caused a real `PutObject` failure ("No writable volumes and no
    # free volumes left") once more than one bucket/collection's worth
    # of volume growth was requested from the same 8-volume cap; do not
    # revert to a fixed cap. `-webdav=false` — BAGMAN doesn't use
    # WebDAV; `server` mode enables it by default, so it must be
    # explicitly turned off.
    command:
      - server
      - -dir=/data
      - -ip=127.0.0.1
      - -ip.bind=127.0.0.1
      - -master=true
      - -volume=true
      - -filer=true
      - -s3=true
      - -s3.port=9000
      - -s3.ip.bind=0.0.0.0
      - -s3.config=/run/secrets/seaweedfs_s3_config
      - -s3.port.iceberg=0
      - -s3.port.lance=0
      - -volume.max=0
      - -webdav=false
    environment:
      TZ: UTC
    secrets:
      - seaweedfs_s3_config
    volumes:
      - bagman-seaweedfs-data:/data
    healthcheck:
      # SeaweedFS's S3 gateway has no MinIO-style `/minio/health/live`
      # path. A bare, unauthenticated `GET /` on the S3 port (9000)
      # answers `403 Forbidden` (live-verified against this exact
      # digest+flags) — that IS the correct "I am up and enforcing
      # auth" signal, not a failure state, so a plain `curl -f` (which
      # treats any 4xx as failure) would misreport a healthy server as
      # down. Accept exactly 200 or 403 as "up"; anything else
      # (connection refused, 5xx, timeout) is correctly reported down.
      test:
        - CMD-SHELL
        - "curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9000/ | grep -qE '^(200|403)$'"
      # SeaweedFS needs longer than plain MinIO did to fully bootstrap
      # (master/volume/filer/S3 all start and cross-register) — the PL
      # measured ~15-20s before the S3 endpoint reliably answered after
      # a restart in testing.
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  bagman-scan:
    # CD-4 WI-3 (PID §19/§20/§60): the content-safety scanning backend
    # for Evidence Intake — a real `clamd` daemon, BAGMAN-owned,
    # internal-only.
    #
    # CD-4 PR #4 Architect delta (2026-09-13): pinned by immutable
    # digest rather than a moving release-channel tag (`:stable`) — see
    # git history for that original rationale. Superseded below.
    #
    # CD-6 ClamAV reliability hardening (2026-09-22, Architect WO):
    # RCA on the live Mac mini M4 (arm64) appliance found the prior
    # `clamav/clamav:stable@sha256:1fdfd24c6f...` digest resolves to an
    # amd64-ONLY manifest. Docker's platform-negotiation therefore ran
    # it under Colima's transparent QEMU user-mode emulation on this
    # host (proven directly: `docker exec bagman-scan ps aux` showed
    # `/usr/bin/qemu-x86_64` wrapping every process; `uname -m` reported
    # `x86_64` despite the VM kernel itself being `aarch64`). Emulated
    # execution measurably inflated the container's own memory
    # footprint under load; `docker inspect bagman-scan --format
    # '{{.State.OOMKilled}}'` returned `true` — definitive (cgroup-level)
    # proof of a real OOM-kill event, not merely circumstantial.
    #
    # Fix: moved to the official `clamav/clamav-debian` image (the
    # ClamAV project's current recommended/maintained image family,
    # multi-arch), pinned to the linux/arm64 PLATFORM-SPECIFIC manifest
    # digest — not the multi-arch index digest — so this production
    # service can never silently fall back to an emulated platform
    # regardless of any future pull/negotiation behaviour change; this
    # is the one real deployment target (Mac mini M4, arm64) and the
    # pin should say so explicitly. (Contrast: tests/app_api/conftest.py
    # pins the INDEX digest instead, deliberately, so the disposable CI
    # fixture container resolves correctly on GitHub's amd64 runners —
    # see that file's own comment. Both digests are equally immutable;
    # they differ only in whether platform resolution is pinned shut or
    # left to negotiate, which is a deliberate, documented difference,
    # not an accidental drift between the two.) Verified natively on
    # this appliance post-deploy: `uname -m` = `aarch64`, no qemu
    # wrapper present in `ps aux`, and a disposable comparison run
    # handled a harder workload at ~1GB peak RSS — comfortably under
    # even the prior 1.5GiB limit, before the further bump below.
    image: clamav/clamav-debian@sha256:32770534ece41601bed0005be5d1e1b7a76d734255c0ad02ad52f9281eb30418
    container_name: bagman-scan
    networks:
      - bagman-net
    # No host port publish (PID §32) — bagman-api reaches this over
    # bagman-net only, at bagman-scan:3310, exactly like bagman-db/
    # bagman-objects above.
    environment:
      TZ: UTC
    healthcheck:
      # `clamdcheck.sh` is this image's OWN official, maintained
      # healthcheck helper (baked in at `/usr/local/bin/clamdcheck.sh`,
      # and in fact the image's own default `HEALTHCHECK` instruction)
      # rather than a hand-rolled `nc`/`grep` pipeline — it speaks the
      # exact same clamd PING/PONG wire protocol we tested directly
      # against this image, but tracking the project's own supported
      # script means any future protocol/behaviour change they ship
      # is picked up automatically instead of silently going stale
      # here. Our own interval/timeout/retries/start_period are kept
      # (tighter than the image's own 360s default start_period, which
      # assumes a cold `freshclam` download from empty — this image
      # ships definitions baked in at build time, verified during this
      # delivery, so clamd is reachable within seconds of starting).
      test: ["CMD-SHELL", "clamdcheck.sh"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  bagman-api:
    build:
      context: ../../
      dockerfile: deployment/docker/api/Dockerfile
      args:
        GIT_COMMIT: ${BAGMAN_GIT_COMMIT:-unknown}
    image: bagman-api:${BAGMAN_IMAGE_TAG:-dev}
    container_name: bagman-api
    networks:
      - bagman-net
    depends_on:
      bagman-db:
        condition: service_healthy
      bagman-objects:
        condition: service_healthy
      bagman-scan:
        condition: service_healthy
    environment:
      BAGMAN_RUNTIME_ENV: production
      BAGMAN_DB_HOST: bagman-db
      BAGMAN_DB_PORT: "5432"
      BAGMAN_DB_NAME: bagman
      BAGMAN_DB_USER: bagman
      BAGMAN_DB_PASSWORD_FILE: /run/secrets/postgres_password
      BAGMAN_OBJECT_STORE_ENDPOINT_URL: http://bagman-objects:9000
      BAGMAN_OBJECT_STORE_BUCKET: bagman-evidence
      BAGMAN_OBJECT_STORE_ACCESS_KEY_FILE: /run/secrets/minio_root_user
      BAGMAN_OBJECT_STORE_SECRET_KEY_FILE: /run/secrets/minio_root_user_password
      BAGMAN_SCANNER_HOST: bagman-scan
      BAGMAN_SCANNER_PORT: "3310"
      # CD-5 Gate-1 real-provider acceptance closure (2026-09-16,
      # superseding the CD-5 WI-2/WI-5 narrative below): HELM has
      # returned `BAGMAN_AI_APPLIANCE_GREEN` — BAGMAN's background
      # inference authority is no longer the shared Trinity LiteLLM
      # installation (`local-ai-gateway`, host port 4000). It is now a
      # dedicated, BAGMAN-exclusive AI appliance at
      # `http://192.168.11.4:4100` — the same dedicated Mac mini
      # (`mac-prod-01`, see CLAUDE.md's Equipment Access table) the
      # locked three-tier topology (PID §2/§8/§9) always named as
      # BAGMAN's primary background tier, now fronted by its own
      # dedicated LiteLLM installation instead of sharing Trinity's.
      # This is still alias-only routing (bagman-fast/bagman-core —
      # never a raw model name, never the Mac mini's own Ollama port
      # 11434 directly) — nothing about
      # `ai/providers/litellm/client.py`'s own contract changes, only
      # which real gateway process this env var points at.
      #
      # CD-6 §103 Inference Architecture Ruling update (2026-09-26):
      # `bagman-deep` (a routine Trinity-hosted escalation tier, no
      # live task contract ever used it) is RETIRED. This same gateway
      # config also fronts the new `trinity-core` alias — CD-6 §103's
      # sole authorised Trinity alias, reached ONLY for backlog/
      # overflow processing via the bounded, operator-invoked
      # `scripts/process_background_job_overflow.py` procedure, never a
      # routine per-request escalation. The `bagman-deep` -> Trinity
      # entry in the Mac's own `bagman-ai-gateway` `config.yaml`
      # (deployment-level, not in this repo) is repurposed/renamed to
      # `trinity-core` by the PL separately, out of this WO's scope.
      #
      # Verified live before this change (2026-09-16, PL's own direct
      # check, not merely relayed): `GET
      # http://192.168.11.4:4100/health/readiness` -> `{"status":
      # "healthy","db":"connected"}` (contrast the old shared gateway's
      # persistent `"db":"Not connected"`); real authenticated
      # `POST /v1/chat/completions` succeeded for all three aliases; a
      # raw physical model name (`gemma4:12b`) was independently
      # rejected by the appliance's OWN key scoping with `HTTP 403
      # key_model_access_denied` — defense-in-depth alongside BAGMAN's
      # own `validate_capability_alias` boundary check, neither
      # relying on the other.
      #
      # No `host.docker.internal`/`extra_hosts` trick is needed for
      # this endpoint (unlike the old `http://localhost:4000` value,
      # see CD-5 WI-5's fix below) — `192.168.11.4` is a real LAN
      # address, not host-loopback, and is directly routable from
      # `bagman-net` the same way any other external host is.
      #
      # --- Prior architecture (CD-5 WI-2/WI-5, retained for history) ---
      # WI-2 originally pointed this at the shared Trinity LiteLLM
      # installation; WI-5 (2026-09-13) fixed a genuine `bagman-api`
      # container-networking defect against THAT gateway (`localhost`
      # inside `bagman-api`'s own container referred to the container
      # itself, not the host — fixed via `host.docker.internal` +
      # `extra_hosts: host-gateway`, Docker-Engine-native since 20.10).
      # That gateway's OWN backing database was then found down
      # (`400 no_db_connection` on every completion) — Helm/Trinity-
      # owned infrastructure, outside BAGMAN's authority — which HELM
      # first attempted to fix via key rotation (partially/
      # intermittently effective, see CD-5 evidence file §6d) and has
      # now superseded entirely with the dedicated appliance above.
      BAGMAN_LITELLM_ENDPOINT: http://192.168.11.4:4100
      BAGMAN_LITELLM_API_KEY_FILE: /run/secrets/litellm_gateway_key
      # CD-5 Gate-2 closure (2026-09-16, PID §97): the bounded headless
      # Claude Code operator runner (agent/claude_code/runner.py) needs
      # its own HOME so `claude` can find its own OAuth/session
      # credential — never an Anthropic API key (the original CD-5
      # WI-3 direct-Anthropic-API design's own secret declaration was
      # removed entirely as part of this closure — see the `secrets:`
      # list below and `PID.md` §97 for the full history). Mounted
      # read-only from the host below (`volumes:`); a bounded,
      # dedicated working directory is created by the runner itself
      # inside the container's own writable layer, no host mount
      # needed for it.
      BAGMAN_CLAUDE_CODE_HOME: /home/claude-operator
      BAGMAN_CLAUDE_CODE_CWD: /tmp/claude-code-operator-cwd
      BAGMAN_LOG_LEVEL: INFO
      TZ: UTC
    # `extra_hosts: host.docker.internal:host-gateway` (CD-5 WI-5,
    # 2026-09-13) was here to reach the old shared Trinity LiteLLM
    # gateway at `http://localhost:4000` from inside this container —
    # see BAGMAN_LITELLM_ENDPOINT's own comment above. Removed
    # 2026-09-16: the new dedicated AI appliance
    # (`http://192.168.11.4:4100`) is a real LAN address, directly
    # routable from `bagman-net` without this mapping.
    secrets:
      - postgres_password
      - minio_root_user
      - minio_root_user_password
      - litellm_gateway_key
    # CD-5 Gate-2 closure: a dedicated Claude Code OAuth/session
    # credential directory — NOT an Anthropic API key, NOT a Compose
    # `secrets:` entry (those are single-file only; this is a small
    # directory: `.claude/.credentials.json` and whatever else Claude
    # Code's own auth mechanism stores). Mounted read-only. First-pass
    # provisioning mechanism, flagged plainly (see
    # deployment/docker/api/prepare-claude-binary.sh's own docstring
    # for the matching caveat on the `claude` binary itself): this
    # currently reuses a real, already-authenticated Claude Code
    # session's own credential, copied to this dedicated path — a
    # more formal, BAGMAN-dedicated credential (e.g. via
    # `claude setup-token`) is a real future hardening step, not
    # solved speculatively here.
    # CD-6 Slice 2 (PID §98.4, architect spec §3/§24): Xero app
    # credentials + per-connection OAuth tokens (`services.xero.secrets`,
    # `_DEFAULT_SECRETS_DIR = "/opt/bagman/secrets/xero"`). No CI/test
    # path depends on this — every existing test either uses
    # `InMemoryTokenStore`/`FakeXero*Client` (development composition)
    # or sets `BAGMAN_XERO_SECRETS_DIR` to a disposable tmp path of its
    # own — and `read_xero_app_credentials()` is missing-file-tolerant
    # (returns `None`, never raises), so an absent host directory here
    # degrades to an honest CONFIG_ERROR, never a crash. Mounted anyway,
    # read-only, matching `claude_code_home` immediately below: this
    # repo's own `/srv/bagman-secrets/` host convention (NOT the Mac
    # appliance's separate `/opt/bagman/secrets/` root — see
    # `/opt/bagman/app/compose/bagman.docker-compose.yml` on
    # `mac-prod-01` for that one), so a local operator who places real
    # Xero credentials at `/srv/bagman-secrets/xero/` can exercise this
    # exact compose stack end-to-end without editing this file.
    volumes:
      - /srv/bagman-secrets/claude_code_home:/home/claude-operator:ro
      - /srv/bagman-secrets/xero:/opt/bagman/secrets/xero:ro
    # The one deliberate host-published entry point (PID §5) — bound to
    # loopback only, not 0.0.0.0.
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped
