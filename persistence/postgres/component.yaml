# BAGMAN component manifest (PID §52) for persistence/postgres/.
# Validated by scripts/generate_architecture_memory.py against
# contracts/manifest/bagman.component_manifest.v1.schema.json.
#
# Added retroactively by CD-3 WI-3 — WI-1 (which built this component)
# shipped without a manifest; this is the first work item to introduce
# component.yaml validation/projection for it.

id: BAGMAN.PERSISTENCE.POSTGRES
version: 3

responsibility: >
  Own durable, PostgreSQL-backed implementations of every CD-2/CD-4/
  CD-5/CD-6 repository interface (GovernedEntity, Source,
  ExternalReference, EvidenceItem, Provenance, AuditEvent, IntakeRecord,
  AIInvocation, NeedsYouItem) plus the SQLAlchemy engine/session factory
  and Alembic migration schema — preserving exactly the same canonical
  behaviour (immutability, idempotent external-reference/evidence-
  observation/intake/needs-you-item replay, append-only audit,
  one-active-invocation-per-subject concurrency, CD-5 PID §73) as the
  in-memory reference implementations core/, services/evidence/, ai/,
  and (CD-6) services/needs_you/ ship, durably.

owns: []

# Implements the repository ABC interfaces core/, services/evidence/,
# services/evidence/intake/, (CD-5 WI-1) ai/, and (CD-6 Slice 1)
# services/needs_you/ define; does not define any canonical domain type
# of its own. Depends on core/'s errors, identity, timestamps, and
# contract_validation; on services/evidence/'s EvidenceItem/
# EvidenceRepository/ExternalReferenceHint; on services/evidence/intake/'s
# IntakeRecord/IntakeRepository; on (CD-5 WI-1) ai/'s
# AIInvocation/AIInvocationRepository/derive_primary_input_reference;
# and on (CD-6 Slice 1) services/needs_you/'s
# NeedsYouItem/NeedsYouRepository/transition.
consumes:
  - BAGMAN.CORE
  - BAGMAN.SERVICES.EVIDENCE
  - BAGMAN.EVIDENCE.INTAKE
  - BAGMAN.AI
  - BAGMAN.NEEDS_YOU

produces: []

dependencies:
  - SQLAlchemy
  - psycopg
  - alembic

external_access: false

prohibited:
  - direct_email_access
  - direct_bank_access
  - direct_xero_access
  - direct_chargebee_access
