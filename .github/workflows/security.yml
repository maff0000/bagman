name: Security

# CD-1's security gate (secret scanning + tests/security/, PID.md
# §14/§15), extended by CD-2 (PID.md §41) to also run the full pytest
# suite added by CD-2: tests/contract/ (schema/contract tests),
# tests/integration/ (domain/lineage behaviour + architectural-boundary
# tests), alongside tests/security/ — i.e. everything PID §41 names:
# security tests, contract tests, domain tests, architectural-boundary
# tests.
#
# A single `pytest tests/ -v` runs all of the above rather than one
# step per named category: verbose output already reports each test's
# full path (tests/<category>/...), so per-category attribution is
# still visible in the log, and a single recursive invocation means a
# future test file added under tests/ is picked up automatically
# instead of silently being skipped because no hardcoded step happened
# to list it.
#
# No step in this workflow requires or references any secret. Gitleaks is
# installed as a pinned release binary (no license key needed for public
# repositories / OSS use), and the full test suite is entirely
# self-contained: no live external dependency (network, database, Redis,
# Docker registry) is used anywhere in tests/security/, tests/contract/,
# or tests/integration/ — confirmed by inspection (only local
# subprocess calls to git/gitleaks and an in-memory core.api instance).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.21.2"

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans full history

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install gitleaks (pinned release binary)
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks scan
        run: gitleaks detect --source . --redact --verbose

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run full test suite (security + contract + domain + architectural-boundary)
        env:
          # Belt-and-braces: pyproject.toml's [tool.pytest.ini_options]
          # pythonpath = ["."] already puts the repo root on sys.path
          # for every pytest invocation (CI or local), which is what
          # lets tests/contract/ and tests/integration/ import the
          # `core` package. This env var is redundant given that but
          # harmless, and kept as an explicit CI-level guarantee.
          PYTHONPATH: ${{ github.workspace }}
        run: pytest tests/ -v
