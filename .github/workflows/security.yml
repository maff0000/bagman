name: Security

# Runs the CD-1 security gate: secret scanning + the deterministic
# security test suite under tests/security/ (PID.md §14/§15).
#
# No step in this workflow requires or references any secret. Gitleaks is
# installed as a pinned release binary (no license key needed for public
# repositories / OSS use), and the security test suite is entirely
# self-contained (it inspects this repository's own git state).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.21.2"

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans full history

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install gitleaks (pinned release binary)
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks scan
        run: gitleaks detect --source . --redact --verbose

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Run security test suite
        run: pytest tests/security/ -v
