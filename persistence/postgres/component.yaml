# BAGMAN component manifest (PID §52) for persistence/postgres/.
# Validated by scripts/generate_architecture_memory.py against
# contracts/manifest/bagman.component_manifest.v1.schema.json.
#
# Added retroactively by CD-3 WI-3 — WI-1 (which built this component)
# shipped without a manifest; this is the first work item to introduce
# component.yaml validation/projection for it.

id: BAGMAN.PERSISTENCE.POSTGRES
version: 2

responsibility: >
  Own durable, PostgreSQL-backed implementations of every CD-2/CD-4/CD-5
  repository interface (GovernedEntity, Source, ExternalReference,
  EvidenceItem, Provenance, AuditEvent, IntakeRecord, AIInvocation) plus
  the SQLAlchemy engine/session factory and Alembic migration schema —
  preserving exactly the same canonical behaviour (immutability,
  idempotent external-reference/evidence-observation/intake replay,
  append-only audit, one-active-invocation-per-subject concurrency,
  CD-5 PID §73) as the in-memory reference implementations core/,
  services/evidence/, and ai/ ship, durably.

owns: []

# Implements the repository ABC interfaces core/, services/evidence/,
# services/evidence/intake/, and (CD-5 WI-1) ai/ define; does not
# define any canonical domain type of its own. Depends on core/'s
# errors, identity, timestamps, and contract_validation; on
# services/evidence/'s EvidenceItem/EvidenceRepository/
# ExternalReferenceHint; on services/evidence/intake/'s
# IntakeRecord/IntakeRepository; and (CD-5 WI-1) on ai/'s
# AIInvocation/AIInvocationRepository/derive_primary_input_reference.
consumes:
  - BAGMAN.CORE
  - BAGMAN.SERVICES.EVIDENCE
  - BAGMAN.EVIDENCE.INTAKE
  - BAGMAN.AI

produces: []

dependencies:
  - SQLAlchemy
  - psycopg
  - alembic

external_access: false

prohibited:
  - direct_email_access
  - direct_bank_access
  - direct_xero_access
  - direct_chargebee_access
