name: Security

# CD-1's security gate (secret scanning + tests/security/, PID.md
# §14/§15), extended by CD-2 (PID.md §41) to also run the full pytest
# suite added by CD-2: tests/contract/ (schema/contract tests),
# tests/integration/ (domain/lineage behaviour + architectural-boundary
# tests), alongside tests/security/ — i.e. everything PID §41 names:
# security tests, contract tests, domain tests, architectural-boundary
# tests. CD-3 (PID.md §59) added tests/persistence/ and tests/app_api/,
# each of which starts its own REAL, disposable PostgreSQL (and, for
# tests/app_api, also MinIO) container via Docker to prove genuine
# durability/no-fallback behaviour — not mocked.
#
# The non-Docker suites (security/contract/integration) run together
# in one `pytest tests/security tests/contract tests/integration -v`
# step, since none of them touch Docker and grouping them is harmless.
#
# tests/persistence/ and tests/app_api/ are DELIBERATELY run as two
# SEPARATE pytest invocations (their own steps below), not folded into
# one `pytest tests/` sweep: each starts its own session-scoped
# PostgreSQL container (and tests/app_api additionally starts a MinIO
# container to exercise its no-fallback proof), and a first attempt at
# running everything in a single `pytest tests/` invocation left both
# session-scoped fixtures alive concurrently for the life of the whole
# process — two Postgres containers (plus MinIO) running at once on a
# GitHub-hosted runner's limited resources caused a live, reproducible
# CI failure (`psycopg.OperationalError: ... server closed the
# connection unexpectedly`) even though the exact same suite passes
# reliably on a more generously-resourced host. Running each Docker-
# backed suite as its own separate pytest process guarantees the prior
# suite's session-scoped fixtures (and its container) are fully torn
# down — the Python interpreter exits between steps — before the next
# suite's container starts, so at most one Postgres (and, only during
# the tests/app_api step, one MinIO) container is ever alive at a time.
# tests/persistence/'s own MinIO-backed object-store tests
# (test_minio_store.py) still skip cleanly here, exactly as before —
# no MinIO is started for that step, only for tests/app_api/'s.
#
# No step in this workflow requires or references any secret. Gitleaks is
# installed as a pinned release binary (no license key needed for public
# repositories / OSS use). tests/security/, tests/contract/, and
# tests/integration/ have no live external dependency at all (only local
# subprocess calls to git/gitleaks and an in-memory core.api instance);
# tests/persistence/ and tests/app_api/ each depend only on the
# Docker-in-Docker capability GitHub-hosted runners already provide, not
# on any external network service or secret.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.21.2"

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans full history

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install gitleaks (pinned release binary)
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks scan
        run: gitleaks detect --source . --redact --verbose

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run non-Docker test suites (security + contract + domain + architectural-boundary)
        env:
          # Belt-and-braces: pyproject.toml's [tool.pytest.ini_options]
          # pythonpath = ["."] already puts the repo root on sys.path
          # for every pytest invocation (CI or local), which is what
          # lets tests/contract/ and tests/integration/ import the
          # `core` package. This env var is redundant given that but
          # harmless, and kept as an explicit CI-level guarantee.
          PYTHONPATH: ${{ github.workspace }}
        run: pytest tests/security tests/contract tests/integration -v

      - name: Run PostgreSQL persistence test suite (own disposable container)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest tests/persistence -v

      - name: Run bagman-api runtime test suite (own disposable Postgres + MinIO)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest tests/app_api -v
