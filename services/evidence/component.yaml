# BAGMAN component manifest (PID §19) for services/evidence/.
# Validated by scripts/generate_architecture_memory.py against
# contracts/manifest/bagman.component_manifest.v1.schema.json.

id: BAGMAN.SERVICES.EVIDENCE
version: 6

responsibility: >
  Own canonical EvidenceItem identity and its immutability and
  idempotent-observation semantics (an EvidenceItem, once recorded, is
  never mutated, and a replayed observation of the same external
  reference resolves to the existing record rather than creating a
  duplicate); also owns EvidenceClassification (an append-only,
  supersession-chained document_type classification of an EvidenceItem)
  and EvidenceClassificationRule (the separate, deterministic
  rule-based classification authority behind CD-6 Slice 5 WI-1) — two
  distinct canonical types this component defines alongside EvidenceItem
  itself, never folded into it. CD-6 Slice 5 WI-2 adds the deterministic
  matcher/observed-evidence-guard/preview/governed-rule-lifecycle/
  classification-service layer on top of that same data model — no new
  canonical type, purely additive compute/orchestration logic.

  As of version 4, also owns EvidenceClassificationJob
  (`evidence/automatic-classification-activation` WO) — the durable,
  asynchronous trigger for the existing, UNMODIFIED
  `classification_orchestrator.classify_evidence`. Before that version,
  classification only ever ran when a human/process explicitly called
  one of the three HTTP endpoints in
  `app/api/routers/evidence_classification.py`; that delivery added the
  missing automatic trigger — a durable job is enqueued immediately
  after either real evidence-creation call site
  (`services/mailbox/microsoft/evidence_ingest.py`,
  `app/api/routers/intake.py`) successfully registers a new
  `EvidenceItem`, and a separate, bounded, operator/cron-invoked worker
  script (`scripts/process_evidence_classification_jobs.py`) later
  claims and processes it, running `classify_evidence` unmodified — no
  new classifier, no new AI task, no new human-review mechanism. See
  `services/evidence/classification_job.py`'s own module docstring for
  the full idempotency (evidence_id-keyed, not a caller-supplied
  idempotency key — a deliberate, documented divergence from
  `ai.jobs.BackgroundJob`'s own idempotency-key doctrine)/lifecycle/
  stale-claim-recovery doctrine this record type implements.

  As of version 5 (architect review, 2026-09-29, first delta), the
  WO's own disclosed enqueue-loss gap is CLOSED by two additions, never
  a historical bulk backfill (that non-goal is unchanged): (1)
  `reconcile_missing_classification_jobs` — at that version, a bounded,
  recency-biased, activation-boundary-scoped scan (reusing
  `EvidenceRepository.list_evidence`'s own existing
  `received_at_from`/`limit` filtering — no new query surface) that
  submitted a job for any evidence with `received_at` on/after a
  hardcoded `AUTOMATIC_CLASSIFICATION_ACTIVATION_BOUNDARY` constant
  that had neither a job nor a current classification yet; wired into
  `scripts/process_evidence_classification_jobs.py`'s `main()`, once,
  before `claim_next_pending`; and (2) `EvidenceClassificationJob` now
  carries a durable `classification_outcome` field (nullable string,
  one of `classification_orchestrator.CLASSIFY_EVIDENCE_OUTCOMES`) —
  `mark_succeeded` now REQUIRES it, `mark_failed` accepts it optionally
  — so the worker's own outcome-to-job-status mapping can honestly
  distinguish a genuine classification success from a governed-but-
  unresolved outcome or an AI failure, never collapsing all of them
  into an undifferentiated SUCCEEDED. Migration `ae936a444eae` (chained
  off `a7f34c9e2d18`) adds the column.

  As of this version (version 6, architect review, 2026-09-29, second
  delta — three further narrow corrections, no architectural reopening
  of `classify_evidence`/the job state machine/reconciliation itself):
  (1) the hardcoded `AUTOMATIC_CLASSIFICATION_ACTIVATION_BOUNDARY`
  constant is REMOVED entirely — `reconcile_missing_classification_jobs`
  now takes `activation_boundary` as an explicit, required parameter,
  supplied for real only by
  `scripts/process_evidence_classification_jobs.py`'s own
  `main()`/`_run_worker`, which reads the
  `BAGMAN_EVIDENCE_CLASSIFICATION_ACTIVATION_BOUNDARY` Layer-2 runtime
  environment variable (`config/README.md`'s own documented "feature
  flags" example) and fails CLOSED — reconciliation is skipped for the
  run, never silently defaulted — if it is unset/malformed; no real
  value exists anywhere yet, including in `config/examples/prod.example.env`,
  which documents the variable as a placeholder only. (2)
  `reconcile_missing_classification_jobs` now genuinely PAGES through
  `EvidenceRepository.list_evidence`'s own existing `limit`+`offset`
  parameters (real DB-level `OFFSET`) instead of inspecting a single
  fixed window once — the renamed `repair_limit` parameter now means
  "max jobs to CREATE this run", not "how many rows to inspect", so a
  backlog larger than `repair_limit` is genuinely repaired across
  repeated same-`repair_limit` calls; a new, explicitly-documented
  `max_rows_scanned` (default 5000) safety bound — a PL judgment call,
  not architect-mandated — prevents a pathological scattered-orphan
  case from becoming an unbounded scan. (3) a new `DEFERRED` job status
  (`EvidenceClassificationJobRepository.mark_deferred`, a new abstract
  method implemented on both `InMemoryEvidenceClassificationJobRepository`
  and `PostgresEvidenceClassificationJobRepository`) replaces the
  previous `AI_IN_PROGRESS -> FAILED_RETRYABLE` mapping: `mark_deferred`
  clears `claimed_by`/`claimed_at` (immediately reclaimable, exactly
  like `PENDING`) AND decrements `attempt_count` by exactly 1,
  compensating for `mark_in_progress`'s own increment for that specific
  claim, so a genuinely-still-running concurrent invocation can never
  consume real attempt/failure budget or wrongly exhaust
  `max_attempts`. No schema/migration change was needed for `DEFERRED`
  — `status` is a plain, unconstrained `String` column (confirmed by
  reading `a7f34c9e2d18`; no DB-level CHECK constraint exists on it,
  mirroring every other status-machine table in this codebase).
  Separately, documentation in `classification_job.py`/
  `process_evidence_classification_jobs.py` claiming an operator could
  recover a `FAILED_TERMINAL` `AI_INVOCATION_FAILED`/`AI_PRIOR_FAILURE`
  job "by hand via the existing HTTP endpoints" is corrected — that
  claim was false (the same classifier fingerprint is recomputed
  identically on any manual retry with unchanged context, so
  `classify_evidence`'s own §27 same-fingerprint guard returns
  `AI_PRIOR_FAILURE` again without a new model call); this is a
  documentation-only correction, no reset/retry mechanism is built
  (architect's own "Option A" ruling).

owns:
  - EvidenceItem
  - EvidenceClassification
  - EvidenceClassificationRule
  - EvidenceClassificationJob

# What services/evidence/ actually imports from core/: identity (id
# generation), timestamps (UTC handling), errors
# (ImmutabilityViolationError, NotFoundError, ValidationError),
# contract_validation (validate_against_contract), text_matching (CD-6
# Slice 5 WI-2 — normalize_address/normalize_domain/domain_from_address/
# normalize_subject_for_policy/subject_matches_predicate; see
# core/text_matching.py's own module docstring), and the
# ExternalReferenceRepository type it is constructed with.
#
# CD-6 Slice 5 WI-2's own shared-normalization refactor extracted
# classification_rule.py's normalization helpers out of
# services/mailbox/domain_rule.py into the neutral core.text_matching
# module (imported directly from core/ — see that module's own
# docstring) — services/evidence/ has ZERO import of services/mailbox/
# anywhere as of WI-2 (proven by
# tests/integration/test_architecture_boundaries.py's own AST-based
# checks), so BAGMAN.MAILBOX is removed from `consumes` below (it is no
# longer a real dependency in code — manifests document dependencies
# that exist, not aspirational ones).
consumes:
  - BAGMAN.CORE

# Every OTHER write in this component still goes through core/api.py's
# central record_audit_event (EVIDENCE_OBSERVED etc — see
# core/component.yaml's own `produces`). CD-6 Slice 5 WI-2's new
# governed rule-lifecycle/classification services
# (services/evidence/classification_rule_service.py,
# services/evidence/classification_service.py) are the first code in
# THIS component to call AuditRepository.record_audit_event directly —
# per core/component.yaml's own documented rule ("attribute a produced
# event to the component whose code actually emits it"), these three
# event types are attributed here, not to core/.
produces:
  - EVIDENCE_CLASSIFICATION_RULE_CREATED
  - EVIDENCE_CLASSIFICATION_RULE_RETIRED
  - EVIDENCE_CLASSIFIED
  # evidence/automatic-classification-activation WO — the one new
  # audit event type `services/evidence/classification_job.py`'s two
  # concrete repositories emit themselves, for the one transition no
  # external caller is ever positioned to observe (a lazy stale-claim
  # recovery pass silently discovering and recovering an abandoned
  # row) — mirrors ai.jobs.BACKGROUND_JOB_STALE_RECOVERY_AUDIT_EVENT_TYPE's
  # own identical role and emission discipline.
  - EVIDENCE_CLASSIFICATION_JOB_STALE_RECOVERED

dependencies:
  - jsonschema
  - rfc3339-validator

external_access: false

prohibited:
  - direct_email_access
  - direct_bank_access
  - direct_xero_access
  - direct_chargebee_access
