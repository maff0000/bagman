# BAGMAN component manifest (PID §52) for app/api/.
# Validated by scripts/generate_architecture_memory.py against
# contracts/manifest/bagman.component_manifest.v1.schema.json.
#
# NOTE (CD-3 WI-3 rename): this package lives at app/api/, not
# runtime/api/ (the prior dispatch's original choice) — a tracked path
# with a directory component literally named `runtime` collides with
# CD-1's tests/security/test_repo_hygiene.py PROHIBITED_DIRECTORY_NAMES
# guard. The `id:` below is unchanged: it names a conceptual component,
# not a literal path.

id: BAGMAN.RUNTIME.API
version: 5

responsibility: >
  Own the FastAPI/Uvicorn HTTP-facing application layer that exposes
  BagmanCanonicalAPI as a runnable, containerised service: health/
  readiness (with a hard no-fallback invariant on readiness failure,
  and — since CD-4 WI-3 — a mandatory content-safety scanner
  reachability check alongside PostgreSQL/object-store), version
  metadata, structured logging, thin internal HTTP wrappers around
  register_entity/register_source/get_evidence/list_evidence/
  trace_provenance, and — CD-4 WI-3 — the governed Evidence Intake HTTP
  API (POST /internal/intake/evidence, GET /internal/intake[/{id}]):
  evidence-registration orchestration (staging bytes into canonical
  storage, registering the EvidenceItem, and the full intake audit
  causation chain) once WI-2's content-validation pipeline reaches
  ACCEPTED, plus closure of the CD-3 direct-upload bypass (the old
  byte-accepting POST /internal/evidence has been removed entirely).
  Also owns the PID §14 composition root — the one place
  BAGMAN_RUNTIME_ENV is read to choose between in-memory and
  PostgreSQL+MinIO+ClamAV-backed repositories/object-store/scanner —
  and the stable MANUAL_UPLOAD Source resolve-or-create lifecycle (PID
  §9). CD-4 WI-4 additionally owns serving the first BAGMAN Documents
  GUI (PID §36-42) as plain static HTML/CSS/vanilla-JS assets
  (app/api/static/), mounted at "/" via Starlette's StaticFiles — no
  separate `bagman-ui` runtime/container was introduced (PID §42's
  "may be selected by FORGE" framework decision: the simplest option
  that needs zero new infrastructure), so this manifest is deliberately
  NOT split into a distinct BAGMAN.RUNTIME.UI component; the GUI is
  judged to genuinely be part of bagman-api's own delivery boundary,
  not a separate bounded component, since it introduces no new process,
  dependency surface, or deployment unit of its own. The GUI itself
  owns/decides no evidence business logic (PID §40) — it is a pure
  client of the very API routes this same manifest already describes.
  CD-5 WI-2 additionally owns `/internal/ai/tasks` (POST) /
  `/internal/ai/invocations[/{id}]` (GET) / `/internal/ai/health`
  (GET) — thin HTTP wrappers over `ai.gateway.background
  .run_background_task` and `AIInvocationRepository`, wiring the new
  `ai_invocation_repository`/`litellm_client` composition fields
  (in-memory repository + deterministic fake in development/test,
  PostgresAIInvocationRepository + the real LiteLLMClient in
  production) — never a second inference-control-plane implementation
  (PID §8), and never a new audit-event-producing responsibility here:
  the AI_INVOCATION_*/AI_OUTPUT_REJECTED events are minted by
  `ai/gateway/background.py` itself (see that component's own
  `component.yaml`), not by this router. CD-5 WI-3 additionally owns
  the Ask BAGMAN HTTP surface (POST /internal/operator/chat,
  app/api/routers/operator.py — a new file, deliberately never added
  to routers/ai.py, WI-2's own in-parallel file) and composition-root
  wiring for the Claude operator provider adapter and the fixed
  agent/tools tool registry (claude_client/tool_registry on
  RuntimeComposition, reusing the same ai_invocation_repository field
  WI-2 already added) — the actual Ask BAGMAN orchestration logic and
  tool registry live in the separate agent/ component (BAGMAN.AGENT),
  consumed here, never reimplemented in app/api/. CD-5 WI-4 additively
  extends both AI HTTP surfaces above rather than introducing new ones:
  `GET /internal/ai/invocations` gains an optional
  `primary_input_reference` query parameter (reusing WI-1's own
  generalised-subject filter, added to `AIInvocationRepository
  .list_invocations`'s ABC/in-memory/PostgreSQL implementations) so a
  caller can ask "every AIInvocation — any task, any status — about
  this one canonical subject", which the pre-existing filter set could
  not answer; and `GET /internal/ai/health` gains the `claude` key
  WI-2's own docstring had left as an open, additive extension point
  (`composition.claude_client.is_available()`, a genuinely separate
  signal from the gateway-wide `bagman-*` checks). `app/api/composition
  .py`'s development/test builder also gains a `default_response` for
  its `FakeLiteLLMClient` (task-shape-aware, matching whichever of the
  three CD-5 background tasks' system prompt is actually running) so a
  real dev-mode server's "Run analysis" button produces a genuine,
  clearly-labelled fake result instead of a 500 — closing a gap that
  blocked this WI's own interactive GUI testing, not a change to any
  HTTP-visible contract. Finally, WI-4 reorganises `app/api/static/`
  (previously one `app.js` monolith) into `shell/`/`shared/`/
  `features/{overview,documents,ai}/` (PID §41) and adds the Ask BAGMAN
  drawer, the Documents "AI Analysis" panel, and Overview's AI status
  area — still plain vanilla ES modules served by the same
  `StaticFiles` mount, no build step, no new runtime/dependency.

owns: []

# What app/api/ actually imports: core.api.BagmanCanonicalAPI and
# core.errors.* (the facade + error vocabulary), the durable
# persistence/postgres/* repositories and persistence/objects/*
# object-store implementations (composition.py only), the in-memory
# persistence/objects/memory_store.InMemoryObjectStore for
# development/test composition, and — CD-4 WI-3 —
# services.evidence.intake.intake.IntakeRepository/
# InMemoryIntakeRepository, persistence.postgres.intake_repository
# .PostgresIntakeRepository, services.evidence.intake.validation_pipeline
# .run_intake_validation, and services.evidence.intake.scanner
# .EvidenceSafetyScanner/ClamAVScanner (composition.py wires the real
# scanner in production; a small dev-only always-CLEAN stub, defined
# and used only inside composition.py, backs development/test mode).
# CD-5 WI-2 additionally imports ai.invocation.AIInvocationRepository/
# InMemoryAIInvocationRepository, ai.gateway.background
# .run_background_task, ai.invocation.BACKGROUND_CAPABILITY_ALIASES,
# ai.providers.litellm.client.LiteLLMClient(Protocol) (production), and
# ai.providers.litellm.fake.FakeLiteLLMClient (development/test),
# plus persistence.postgres.ai_invocation_repository
# .PostgresAIInvocationRepository (composition.py only). CD-5 WI-3
# additionally consumes: ai.providers.claude.client
# .ClaudeClient(Protocol)/ai.providers.claude.fake.FakeClaudeClient,
# and agent.tools.{registry,handlers,background} (composition.py wires
# the real ClaudeClient in production, the deterministic
# FakeClaudeClient in development/test — PID §61) — reusing the same
# AIInvocationRepository/PostgresAIInvocationRepository WI-2 already
# wired in, never a second one.
consumes:
  - BAGMAN.CORE
  - BAGMAN.SERVICES.EVIDENCE
  - BAGMAN.EVIDENCE.INTAKE
  - BAGMAN.PERSISTENCE.POSTGRES
  - BAGMAN.PERSISTENCE.OBJECTS
  - BAGMAN.AI
  - BAGMAN.AI.GATEWAY
  - BAGMAN.AI.PROVIDERS.LITELLM
  - BAGMAN.AGENT

# app/api/ does not itself emit AuditEvents for CD-2's own canonical
# writes — those go through core.api.BagmanCanonicalAPI, which already
# emits its own events (see core/component.yaml's `produces`). CD-4
# WI-3 is the one exception: app/api/routers/intake.py's governed
# intake endpoint IS the orchestration layer that emits the
# intake-workflow audit events themselves (INTAKE_RECEIVED,
# INTAKE_VALIDATION_STARTED, INTAKE_REJECTED, INTAKE_QUARANTINED,
# INTAKE_ACCEPTED, EVIDENCE_STORED, EVIDENCE_REGISTERED,
# INTAKE_COMPLETED, INTAKE_FAILED) — via core.api.BagmanCanonicalAPI
# .record_audit_event(), not a new repository, but the event TYPES
# themselves are minted here, not inside core/ or services/evidence/.
produces:
  - INTAKE_RECEIVED
  - INTAKE_VALIDATION_STARTED
  - INTAKE_REJECTED
  - INTAKE_QUARANTINED
  - INTAKE_ACCEPTED
  - EVIDENCE_STORED
  - EVIDENCE_REGISTERED
  - INTAKE_COMPLETED
  - INTAKE_FAILED

dependencies:
  - fastapi
  - starlette
  - uvicorn
  - python-multipart
  - SQLAlchemy
  - alembic

external_access: false

prohibited:
  - direct_email_access
  - direct_bank_access
  - direct_xero_access
  - direct_chargebee_access
